[platformio]
default_envs = wt32-eth01

; First flash over the CP2102 USB-serial adapter (manual BOOT + RESET, see WIRING.md)
[env:wt32-eth01]
platform = espressif32 @ 6.9.0
board = wt32-eth01
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; two 1.9 MB app slots so OTA updates have room
board_build.partitions = min_spiffs.csv
lib_deps =
	h2zero/NimBLE-Arduino @ 1.4.3
	contrem/arduino-timer @ 3.0.1
	esp32async/AsyncTCP @ 3.3.2
	bolderflight/Bolder Flight Systems ULEB128 @ 2.1.2
	prampec/IotWebConf @ 3.2.1
build_flags =
	-DSERIAL_DEBUG_BAUDRATE=${env:wt32-eth01.monitor_speed}
	-DCORE_DEBUG_LEVEL=3
board_build.embed_files =
	src-web/index.html
	src-web/settings.html
	src-web/probe.html
	src-web/favicon.ico
	src-web/style.css
test_ignore = *

; Every later update over Ethernet. Replace the host with your device's name or IP
; and the auth value with the device password (default: the host name, e.g. SHIFTR-123456).
[env:wt32-eth01_ota]
extends = env:wt32-eth01
upload_protocol = espota
upload_port = SHIFTR-123456.local
upload_flags =
	--port=3232
	--auth=SHIFTR-123456

[env:wt32-eth01_local]
extends = env:wt32-eth01
extra_scripts = pre:.github/workflows/build.py

; PC unit tests for the physics and protocol code: pio test -e native
[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
build_flags = -std=gnu++11 -DUNITY_INCLUDE_DOUBLE
