<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<script type="text/javascript">
    function updateStatus() {
        let connectionStatus = document.getElementById('connection_status');
        let version = document.getElementById('version');
        let buildTimestamp = document.getElementById('build_timestamp');
        let deviceName = document.getElementById('device_name');
        let statusContainer = document.getElementById('status_container');
        let hostName = document.getElementById('hostname');
        let ethernet = document.getElementById('ethernet');
        let wifi = document.getElementById('wifi');
        let ble = document.getElementById('ble');
        let service = document.getElementById('service');
        let dircon = document.getElementById('dircon');
        let mode = document.getElementById('mode');
        let freeheap = document.getElementById('freeheap');

        fetch('/status', {
            method: 'GET',
            cache: 'no-store',
            headers: {
                'Accept': 'application/json',
                'Cache-Control': 'no-cache',
            },
        })
            .then(response => response.json())
            .then(response => {
                connectionStatus.innerHTML = 'Connected';
                connectionStatus.className = 'statusgreen';
                version.style = '';
                version.innerHTML = response.version;
                buildTimestamp.innerHTML = response.build_timestamp;
                deviceName.style = '';
                deviceName.innerHTML = response.device_name;
                hostName.innerHTML = response.hostname;
                ethernet.innerHTML = response.ethernet_status;
                wifi.innerHTML = response.wifi_status;
                ble.innerHTML = response.ble_status;
                service.innerHTML = response.service_status;
                dircon.innerHTML = response.dircon_status;
                mode.innerHTML = response.mode;
                document.getElementById('trainer_protocol').innerHTML = response.trainer_protocol;
                freeheap.innerHTML = response.free_heap;
                statusContainer.style = '';
            })
            .catch(reason => {
                connectionStatus.innerHTML = 'Disconnected';
                connectionStatus.className = 'statusred';
            })
            .finally(setTimeout('updateStatus()', 5000));

    }

    function setText(id, value) {
        document.getElementById(id).innerHTML = value;
    }


    // Calibration: compare the trainer's measured power with the power the simulated bike needs,
    // averaged over 30 s of steady riding (same gear, same grade, pedalling).
    const CAL_SAMPLES = 30;
    const CAL_MIN_SAMPLES = 20;
    let cal = [];

    function updateCalibration(live) {
        let virtual = live.zwift_mode.indexOf('virtual') >= 0;
        let model = live.model_power;
        let why = '';
        if (!virtual) {
            why = 'only while Zwift is in SIM with virtual shifting (ride in a free ride or route, not ERG)';
        } else if (live.cadence < 50) {
            why = 'start pedalling (over 50 rpm)';
        } else if (model <= 0) {
            why = 'descending, the simulated bike needs no power';
        }
        setText('live_model', why ? '<small>' + why + '</small>' : model + ' W');

        let sample = { power: live.power, model: model, drag: live.drag_power, grade: live.smoothed_grade, gear: live.virtual_gear };
        if (why || (cal.length > 0 && (sample.gear != cal[0].gear || Math.abs(sample.grade - cal[0].grade) > 1.0))) {
            cal = [];
        }
        if (!why) {
            cal.push(sample);
            if (cal.length > CAL_SAMPLES) cal.shift();
        }

        let conversion = live.trainer_weight > 0 ? live.trainer_weight : live.total_weight;
        let weightText = live.trainer_weight > 0 ? (live.trainer_weight.toFixed(0) + ' kg') : ('0 = Zwift weight (' + live.total_weight.toFixed(0) + ' kg)');
        setText('live_trainer_weight', weightText);

        if (cal.length < CAL_MIN_SAMPLES) {
            setText('live_average', why ? '-' : '<small>hold this gear and grade: ' + cal.length + ' / ' + CAL_MIN_SAMPLES + ' s</small>');
            setText('live_suggestion', '<small>Ride a steady climb of 4 % or more in one gear for 30 s</small>');
            return;
        }
        let avg = (key) => cal.reduce((sum, s) => sum + s[key], 0) / cal.length;
        let power = avg('power'), modelAvg = avg('model'), drag = avg('drag'), grade = avg('grade');
        let ratio = power / modelAvg * 100;
        setText('live_average', power.toFixed(0) + ' W measured, ' + modelAvg.toFixed(0) + ' W simulated = <b>' + ratio.toFixed(0) + ' %</b> <small>(last ' + cal.length + ' s)</small>');

        // trainer weight only scales the part that goes to the trainer as a grade, not the air drag
        let gradePart = modelAvg - drag;
        if (grade < 3.5 || gradePart < 0.6 * modelAvg) {
            setText('live_suggestion', '<small>Needs a climb of 4 % or more (now ' + grade.toFixed(1) + ' %). On the flat this compares air drag instead: within about 10 % means the trainer applies it correctly.</small>');
            return;
        }
        let share = (power - drag) / gradePart;
        if (Math.abs(share - 1) <= 0.05) {
            setText('live_suggestion', '<b>Matches</b> within 5 %, nothing to change');
            return;
        }
        let suggested = Math.round(conversion * share);
        suggested = Math.min(250, Math.max(30, suggested));
        setText('live_suggestion', 'Set <b>Trainer weight</b> to <b>' + suggested + ' kg</b> in Settings <small>(trainer is ' + (share > 1 ? 'harder' : 'easier') + ' than the simulated bike on this climb)</small>');
    }


    // trainer vs power meter, averaged over the last 30 s of pedalling above 50 W on both
    let pmWindow = [];
    function updatePowerMeter(live) {
        let text;
        if (live.pm_state == 'connected') {
            text = live.pm_power + ' W &middot; ' + live.pm_cadence + ' rpm'
                + (live.pm_balance >= 0 ? ' &middot; L ' + Math.round(live.pm_balance) + ' / R ' + (100 - Math.round(live.pm_balance)) : '')
                + ' <small>(' + live.pm_name + (live.pm_battery >= 0 ? ', battery ' + live.pm_battery + ' %' : '') + ', ' + live.pm_rssi + ' dBm)</small>';
        } else if (live.pm_state == 'searching') {
            text = 'searching for ' + (live.pm_name || 'the meter') + ' <small>(turn the cranks to wake it)</small>';
        } else if (live.pm_state == 'not paired') {
            text = '<a href="/settings">not paired</a>';
        } else {
            text = live.pm_state;
        }
        setText('live_pm', text);
        if (live.pm_state == 'connected' && live.pm_age_ms >= 0 && live.pm_age_ms < 3000 && live.power > 50 && live.pm_power > 50) {
            pmWindow.push({ trainer: live.power, meter: live.pm_power });
            if (pmWindow.length > 30) pmWindow.shift();
        } else if (live.cadence < 30) {
            pmWindow = [];
        }
        if (pmWindow.length >= 10) {
            let t = pmWindow.reduce((sum, x) => sum + x.trainer, 0), m = pmWindow.reduce((sum, x) => sum + x.meter, 0);
            setText('live_ratio', (t / m).toFixed(3) + ' <small>(' + (t / pmWindow.length).toFixed(0) + ' W vs ' + (m / pmWindow.length).toFixed(0) + ' W, last ' + pmWindow.length + ' s)</small>');
        } else {
            setText('live_ratio', live.pm_state == 'connected' ? '<small>pedal above 50 W for 10 s</small>' : '-');
        }
    }

    function updateLive() {
        fetch('/live', { method: 'GET', cache: 'no-store', headers: { 'Accept': 'application/json' } })
            .then(response => response.json())
            .then(live => {
                setText('live_trainer', live.trainer_connected ? (live.trainer_name + ' via ' + live.protocol + (live.protocol == 'FTMS' ? (live.control ? ' (control granted)' : ' (no control yet)') : '')) : 'Not connected');
                setText('live_power', live.power + ' W');
                setText('live_power_cal', live.power + ' W');
                updateCalibration(live);
                updatePowerMeter(live);
                setText('live_cadence', live.cadence + ' rpm <small>(' + live.cadence_source + ')</small>');
                setText('live_speed', live.speed_kph.toFixed(1) + ' km/h');
                setText('live_zwift', live.zwift_clients > 0 ? (live.zwift_mode + ', ' + live.zwift_clients + ' connection(s)') : 'Not connected');
                setText('live_gear', live.virtual_gear != '-' ? (live.virtual_gear + ' <small>(ratio ' + live.gear_ratio.toFixed(2) + ')</small>') : '-');
                setText('live_grade', live.zwift_grade.toFixed(1) + ' %' + (live.zwift_mode.indexOf('virtual') >= 0 ? ' <small>(smoothed ' + live.smoothed_grade.toFixed(1) + ' %)</small>' : ''));
                setText('live_drag', live.trainer_cw > 0 ? ('Cw ' + live.trainer_cw.toFixed(2) + ' kg/m to trainer' + (live.residual_drag > 0.5 ? ' <small>(+' + live.residual_drag.toFixed(0) + ' N over the limit, added to the grade)</small>' : '')) : '-');
                setText('live_command', live.trainer_command);
                setText('live_blocked', live.blocked_writes);
                setText('live_logger', (live.logger_age_ms >= 0 && live.logger_age_ms < 90000) ? 'recording (last fetch ' + Math.round(live.logger_age_ms / 1000) + ' s ago)' : '<a href="/logger">not recording</a>');
                setText('live_packets', live.packets);
                document.getElementById('live_container').style = '';
            })
            .catch(reason => {})
            .finally(() => setTimeout(updateLive, 1000));
    }

    function setup() {
        let settings = document.getElementById('settings_btn');
        settings.onclick = function () { location.href = '/settings'; };
        let firmware = document.getElementById('firmware_btn');
        firmware.onclick = function () { location.href = '/firmware'; };
        updateStatus();
        updateLive();
    }
</script>

<body onLoad="setup()">

    <div class="container" id="header_container">
        <a class="helpbadge" href="https://github.com/JuergenLeber/SHIFTR" target="_blank">?</a>
        <div id="header_wrapper">
            <div id="logo_container">
                <img src="favicon.ico" width=64 alt="logo" />
                <h1 class="title">&nbsp;<b>SHIFTR</b>&nbsp;<span id="version" style="display: none"></span></h1>
            </div>
        </div>
        <h5 id="build_timestamp"></h5>
        <h2 id="device_name" style="display: none">DEVICE-NAME</h2>
    </div>
    <div class="container" id="connection_container">
        <div id="connection_status" class="statusgreen">Connected</div>
    </div>
    <div class="container" id="live_container" style="display: none">
        <h1>Ride</h1>
        <div class="form">
            <div>
                <div class="form-control"><label>Trainer:</label><span id="live_trainer"></span></div>
                <div class="form-control"><label>Power:</label><span id="live_power"></span></div>
                <div class="form-control"><label>Power meter:</label><span id="live_pm"></span></div>
                <div class="form-control"><label>Trainer ÷ meter:</label><span id="live_ratio"></span></div>
                <div class="form-control"><label>Cadence:</label><span id="live_cadence"></span></div>
                <div class="form-control"><label>Speed:</label><span id="live_speed"></span></div>
                <div class="form-control"><label>Zwift:</label><span id="live_zwift"></span></div>
                <div class="form-control"><label>Virtual gear:</label><span id="live_gear"></span></div>
                <div class="form-control"><label>Zwift grade:</label><span id="live_grade"></span></div>
                <div class="form-control"><label>Air drag:</label><span id="live_drag"></span></div>
                <div class="form-control"><label>Sent to trainer:</label><span id="live_command"></span></div>
                <div class="form-control"><label>Data received:</label><span id="live_packets"></span></div>
                <div class="form-control"><label>Blocked writes:</label><span id="live_blocked"></span></div>
                <div class="form-control"><label>Logger:</label><span id="live_logger"></span></div>
            </div>
        </div>
        <h1>Calibration</h1>
        <div class="form">
            <div>
                <div class="form-control"><label>Measured power:</label><span id="live_power_cal"></span></div>
                <div class="form-control"><label>Simulated bike needs:</label><span id="live_model"></span></div>
                <div class="form-control"><label>30 s average:</label><span id="live_average"></span></div>
                <div class="form-control"><label>Trainer weight now:</label><span id="live_trainer_weight"></span></div>
                <div class="form-control"><label>Suggestion:</label><span id="live_suggestion"></span></div>
            </div>
        </div>
    </div>
    <div class="container" id="status_container" style="display: none">
        <h1>Status</h1>
        <div class="form">
            <div>
                <div class="form-control">
                    <label>Hostname:</label>
                    <span id="hostname"></span>
                </div>
                <div class="form-control">
                    <label>Ethernet:</label>
                    <span id="ethernet"></span>
                </div>
                <div class="form-control">
                    <label>WiFi:</label>
                    <span id="wifi"></span>
                </div>
                <div class="form-control">
                    <label>BLE:</label>
                    <span id="ble"></span>
                </div>
                <div class="form-control">
                    <label>Service:</label>
                    <span id="service"></span>
                </div>
                <div class="form-control">
                    <label>DirCon:</label>
                    <span id="dircon"></span>
                </div>
                <div class="form-control">
                    <label>Trainer protocol:</label>
                    <span id="trainer_protocol"></span>
                </div>
                <div class="form-control">
                    <label>Mode:</label>
                    <span id="mode"></span>
                </div>
                <div class="form-control">
                    <label>Free heap:</label>
                    <span id="freeheap"></span>&nbsp;<span>bytes</span>
                </div>
                <div class="button-container">
                    <button class="btn" id="settings_btn">
                        <label>Device settings</label>
                    </button>
                    <button class="btn" id="firmware_btn">
                        <label>Firmware update</label>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="form" style="text-align: center">
            Based on <a href="https://github.com/JuergenLeber/SHIFTR">SHIFTR</a> by J&uuml;rgen Leber,
            &copy; SHIFTR contributors, GPL-3.0.
            <br>Saris FTMS fork: <a href="https://github.com/andrewbmoss/SHIFTR">andrewbmoss/SHIFTR</a>.
            Report bugs for this version <a href="https://github.com/andrewbmoss/SHIFTR/issues">there</a>.
            <br><a href="/logger">Logger</a> &middot; <a href="/probe">Diagnostics</a>
            <br>
        </div>
    </div>

</body>

</html>
